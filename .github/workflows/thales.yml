name: thales

on:
  push:
    branches: [main, thales-rewrite]
    paths:
      - "engines/thales/**"
      - "tarski/**"
      - "spec/**"
      - "src/**"
      - "tests/**"
      - "lemma/**"
      - "schemas/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/thales.yml"
  # No path filter: this job is a required check on main, and a required
  # check that never reports reads as pending forever, not as skipped. The
  # push trigger above stays filtered — nothing gates on it.
  pull_request:
  # The merge queue builds each candidate on top of main and runs these
  # same jobs on it; the required checks report from this event too.
  merge_group:

# A superseded pull-request run is cancelled; a merge-queue run never is.
# Cancelling a queue run reports its required check as cancelled, which
# ejects the pull request from the queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24.x"
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  TZ: UTC

defaults:
  run:
    working-directory: engines/thales

jobs:
  lean-tests:
    name: Lean tests
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/thales-setup

      - name: Format check
        run: npm run format:check
        working-directory: .

      - name: Lean tests
        run: lake build ThalesDslTest

  verdict-channel:
    name: Verdict channel
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/thales-setup
        with:
          emit: "true"

      - name: Verdict channel
        run: npm run check:verdict-channel

  envelopes:
    name: Envelope expectations
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/thales-setup
        with:
          emit: "true"

      - name: Envelope expectations
        run: npm run check:envelopes
        env:
          LAKATOS_PROVE_E2E: "1"

  prove-e2e:
    name: Prove end to end
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/thales-setup
        with:
          emit: "true"

      - name: Prove end-to-end
        # vitest positionals are substring filters (tests/e2e.test.ts also
        # matches engines/pabst/tests/e2e.test.ts); serialized because
        # parallel forks would race lake builds in the same checkout.
        run: npx vitest run --no-file-parallelism --exclude "engines/**" tests/e2e.test.ts tests/verdict-corpus.test.ts
        working-directory: .
        env:
          LAKATOS_PROVE_E2E: "1"

  thales:
    # The required-check context. Its name must stay exactly
    # "Build + verdict channel": the main ruleset names it, and a required
    # context that never reports blocks every pull request.
    name: Build + verdict channel
    if: always() && github.event_name != 'push'
    needs: [lean-tests, verdict-channel, envelopes, prove-e2e]
    runs-on: ubuntu-latest
    steps:
      # `needs` alone does not fail a dependent job when a dependency is
      # cancelled or skipped, so a cancelled job would report this required
      # check green. Assert each result explicitly.
      - name: Assert every job succeeded
        working-directory: .
        run: |
          results='${{ join(needs.*.result, ',') }}'
          echo "job results: $results"
          case "$results" in
            *failure* | *cancelled* | *skipped*)
              echo "at least one thales job did not succeed"
              exit 1
              ;;
          esac
          echo "all thales jobs succeeded"
