name: thales

on:
  push:
    branches: [main, thales-rewrite]
    paths:
      - "engines/thales/**"
      - "spec/**"
      - ".github/workflows/thales.yml"
  pull_request:
    paths:
      - "engines/thales/**"
      - "spec/**"
      - ".github/workflows/thales.yml"

env:
  NODE_VERSION: "24.x"
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  TZ: UTC

defaults:
  run:
    working-directory: engines/thales

jobs:
  build-and-test:
    name: Build + verdict channel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: engines/thales
          # We run our own lake commands below; tell the action not to build/test/lint.
          auto-config: false
          build: false
          test: false
          lint: false
          # We manage .lake/build + .lake/packages caching manually below.
          use-github-cache: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: engines/thales/package-lock.json

      - name: npm install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Cache Lake build artifacts
        uses: actions/cache@v6
        with:
          path: |
            engines/thales/.lake/build
            engines/thales/.lake/packages
          key: lake-${{ runner.os }}-${{ hashFiles('engines/thales/lean-toolchain', 'engines/thales/lakefile.lean', 'engines/thales/lake-manifest.json') }}
          restore-keys: |
            lake-${{ runner.os }}-

      - name: Build
        run: lake build

      - name: Verdict channel
        run: npm run check:verdict-channel
