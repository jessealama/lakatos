name: tarski

on:
  push:
    branches: [main]
    paths:
      - "tarski/**"
      - ".github/workflows/tarski.yml"
  pull_request:
    paths:
      - "tarski/**"
      - ".github/workflows/tarski.yml"

env:
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  TZ: UTC

defaults:
  run:
    working-directory: tarski

jobs:
  build-and-test:
    name: Build + Lean tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: tarski
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false

      - name: Cache Lake build artifacts
        uses: actions/cache@v6
        with:
          path: tarski/.lake/build
          key: tarski-${{ runner.os }}-${{ hashFiles('tarski/lean-toolchain', 'tarski/lakefile.lean') }}
          restore-keys: |
            tarski-${{ runner.os }}-

      - name: Build
        run: lake build

      - name: Build the evaluator's binary
        run: lake build tarski

      - name: Lean tests
        run: lake build TarskiTest

      # The seam end to end: this document is the parser bridge's output,
      # byte for byte (tarski/frontend/tests/bridge-cli.test.ts holds the
      # two copies together), and the binary is what reads it. Node is not
      # installed in this job, so the bridge itself runs in the lakatos
      # workflow, not here.
      - name: Run a script
        run: |
          out=$(.lake/build/bin/tarski run Test/Tarski/fixtures/numeric-loop.json)
          test "$out" = "8" || { echo "expected 8, got $out"; exit 1; }
