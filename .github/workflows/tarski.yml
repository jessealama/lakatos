name: tarski

on:
  push:
    branches: [main]
    paths:
      - "tarski/**"
      - ".github/workflows/tarski.yml"
  pull_request:
    paths:
      - "tarski/**"
      - ".github/workflows/tarski.yml"

env:
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  TZ: UTC

defaults:
  run:
    working-directory: tarski

jobs:
  build-and-test:
    name: Build + Lean tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: tarski
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false

      - name: Cache Lake build artifacts
        uses: actions/cache@v6
        with:
          path: tarski/.lake/build
          key: tarski-${{ runner.os }}-${{ hashFiles('tarski/lean-toolchain', 'tarski/lakefile.lean') }}
          restore-keys: |
            tarski-${{ runner.os }}-

      - name: Build
        run: lake build

      - name: Lean tests
        run: lake build TarskiTest
