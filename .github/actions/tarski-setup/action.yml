name: tarski setup
description: Node, Lean toolchain, a restored Lake build, and the built TypeScript for the tarski package.

runs:
  using: composite
  steps:
    # The runner is TypeScript and the binary is Lean, and the checks these
    # jobs run need both. The bridge's own vitest suites still run in
    # `lakatos.yml`.
    - name: Install Node
      uses: actions/setup-node@v7
      with:
        node-version: 26
        cache: npm
        cache-dependency-path: package-lock.json

    - name: Install Lean toolchain
      uses: leanprover/lean-action@v1
      with:
        lake-package-directory: tarski
        auto-config: false
        build: false
        test: false
        lint: false
        use-github-cache: false

    # Restore only; the push-to-main warmer is the single writer.
    - name: Restore Lake build artifacts
      uses: actions/cache/restore@v6
      with:
        path: tarski/.lake/build
        key: tarski-${{ runner.os }}-${{ hashFiles('tarski/lean-toolchain', 'tarski/lakefile.lean') }}
        restore-keys: |
          tarski-${{ runner.os }}-

    - name: Install npm dependencies
      run: npm ci
      shell: bash

    - name: Build the TypeScript
      run: npm run build
      shell: bash

    - name: Build
      run: lake build
      shell: bash
      working-directory: tarski
